name: Monitor and publish status
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  push:
    branches: [main]
    paths-ignore: ['site/status.json']
  workflow_dispatch:
    inputs:
      exercise:
        description: 'Send labeled outage and recovery test emails; do not change live status'
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: status-monitor
  cancel-in-progress: false
jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: https://status.timelap.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
          package-manager-cache: false
      - id: tests
        run: node --test monitor.test.mjs
      - name: Observe service and notify support
        id: monitor
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          STATUS_EXERCISE: ${{ inputs.exercise }}
        run: node monitor.mjs
      - name: Preserve observation and notification retry state
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record public service check'
            git push
          fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        with:
          path: site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
      - name: Report notification failure
        if: ${{ !cancelled() && steps.monitor.outcome == 'failure' }}
        run: exit 1
